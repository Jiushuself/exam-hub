<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资料卡变体 04 · 现代简洁（Tailwind）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family:
          -apple-system, 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans',
          'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 antialiased">
    <main class="flex min-h-screen items-center justify-center p-6">
      <!-- 核心内容卡片 -->
      <section
        class="w-full max-w-2xl rounded-2xl bg-white p-8 shadow-lg sm:p-10"
        aria-labelledby="notice-title"
      >
        <!-- 顶部标签 -->
        <span
          class="inline-flex items-center rounded-lg bg-emerald-100 px-3 py-1 text-xs font-semibold tracking-wide text-emerald-700"
        >
          手机转存提醒
        </span>

        <!-- 主标题 -->
        <h1
          id="notice-title"
          class="mt-3 text-3xl font-bold tracking-tight text-gray-900"
        >
          请先转存，再观看
        </h1>

        <!-- 核心警告提示 -->
        <div
          class="mt-5 flex gap-3 rounded-xl border border-red-100 border-l-4 border-l-red-400 bg-red-50 p-4"
          role="alert"
        >
          <svg
            class="h-5 w-5 flex-none text-red-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
            />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
          <div>
            <p class="text-sm leading-6 text-gray-800">
              未转存直接播放通常只能
              <strong class="font-bold text-red-600">试看 2 分钟</strong>
            </p>
            <p class="mt-1 text-sm text-gray-600">
              请使用手机打开链接，通过对应网盘 App 保存到自己的网盘。
            </p>
          </div>
        </div>

        <!-- 步骤引导：三张圆形图标卡片 -->
        <ol class="mt-7 flex items-start" aria-label="手机转存步骤">
          <!-- 步骤 1 -->
          <li class="flex flex-col items-center text-center">
            <span
              class="flex h-16 w-16 items-center justify-center rounded-full bg-gray-50 ring-1 ring-gray-200"
            >
              <svg
                class="h-6 w-6 text-gray-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
                <path d="M11 18.5h2" />
              </svg>
            </span>
            <span class="mt-2.5 text-sm font-medium text-gray-700"
              >手机打开</span
            >
          </li>

          <!-- 连接虚线 -->
          <div
            class="mx-3 mt-8 flex-1 border-t-2 border-dashed border-gray-200"
            aria-hidden="true"
          ></div>

          <!-- 步骤 2（核心动作，品牌绿高亮） -->
          <li class="flex flex-col items-center text-center">
            <span
              class="flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 ring-2 ring-emerald-200"
            >
              <svg
                class="h-6 w-6 text-emerald-600"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3v12" />
                <path d="m7 10 5 5 5-5" />
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
              </svg>
            </span>
            <span class="mt-2.5 text-sm font-semibold text-emerald-700">
              保存到网盘
            </span>
          </li>

          <!-- 连接虚线 -->
          <div
            class="mx-3 mt-8 flex-1 border-t-2 border-dashed border-gray-200"
            aria-hidden="true"
          ></div>

          <!-- 步骤 3 -->
          <li class="flex flex-col items-center text-center">
            <span
              class="flex h-16 w-16 items-center justify-center rounded-full bg-gray-50 ring-1 ring-gray-200"
            >
              <svg
                class="h-6 w-6 text-gray-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9.5" />
                <path
                  d="m10 8.5 5 3.5-5 3.5z"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>
            </span>
            <span class="mt-2.5 text-sm font-medium text-gray-700"
              >网盘内观看</span
            >
          </li>
        </ol>

        <!-- 行动按钮 -->
        <div class="mt-8 flex justify-center">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full bg-emerald-600 px-7 py-3 text-sm font-semibold text-white shadow-md shadow-emerald-600/25 transition hover:bg-emerald-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              />
            </svg>
            复制网盘链接
          </button>
        </div>

        <!-- 底部信息 -->
        <footer
          class="mt-8 flex items-center justify-between gap-4 border-t border-gray-100 pt-4 text-xs text-gray-400"
        >
          <small>资料状态、完整性及授权情况，请以各条资料说明为准。</small>
          <small class="flex-none">APP · 手机端</small>
        </footer>
      </section>
    </main>
  </body>
</html>
