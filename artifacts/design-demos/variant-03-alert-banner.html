<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资料卡变体 03 · 警示横幅</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f3f7f4;
        --surface: #ffffff;
        --ink: #14251f;
        --muted: #5d6c66;
        --line: #dbe4df;
        --line-strong: #bfcfc7;
        --rust: #b45f49;
        --amber: #e4ae3e;
        --serif: 'Noto Serif SC', 'Songti SC', SimSun, serif;
        --sans: 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
        --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 68px 48px;
        background:
          radial-gradient(
            1100px 480px at 50% -12%,
            color-mix(in srgb, var(--amber) 7%, transparent),
            transparent
          ),
          var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }
      .stage {
        width: min(980px, 100%);
      }
      .variant {
        margin-bottom: 20px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
      }
      .variant b {
        color: var(--rust);
      }

      /* ── 警示横幅 ── */
      .banner {
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 20px;
        background: var(--surface);
        box-shadow:
          0 30px 80px -36px rgba(20, 50, 40, 0.24),
          0 8px 24px -16px rgba(20, 50, 40, 0.16);
      }
      .banner__head {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 26px 30px;
        background:
          radial-gradient(
            620px 220px at 8% -30%,
            rgba(228, 174, 62, 0.22),
            transparent 62%
          ),
          #152b24;
      }
      .banner__icon {
        display: grid;
        flex: 0 0 auto;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(228, 174, 62, 0.4);
        border-radius: 16px;
        background: rgba(228, 174, 62, 0.13);
      }
      .banner__icon svg {
        width: 30px;
        height: 30px;
      }
      .banner__titles {
        display: grid;
        flex: 1;
        gap: 9px;
      }
      .banner__chip {
        width: fit-content;
        padding: 4px 11px;
        border: 1px solid rgba(228, 174, 62, 0.42);
        border-radius: 999px;
        color: #ecc472;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      .banner__titles h2 {
        color: #f3f7f4;
        font-family: var(--serif);
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .banner__titles h2 em {
        color: var(--amber);
        font-style: normal;
      }
      .banner__limit {
        flex: 0 0 auto;
        padding: 9px 18px;
        border: 1px dashed rgba(232, 194, 110, 0.5);
        border-radius: 14px;
        text-align: center;
      }
      .banner__limit small {
        display: block;
        color: #94a79e;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.22em;
      }
      .banner__limit b {
        display: block;
        color: var(--amber);
        font-family: var(--mono);
        font-size: 23px;
        font-weight: 800;
        line-height: 1.3;
      }
      .banner__limit span {
        display: block;
        color: #a9b8b1;
        font-size: 10.5px;
      }
      .banner__body {
        display: grid;
        gap: 14px;
        padding: 20px 30px 22px;
      }
      .banner__msg {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 13.5px;
        line-height: 1.65;
      }
      .banner__msg strong {
        padding: 2px 9px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--rust) 9%, var(--surface));
        color: var(--rust);
        font-size: 13px;
        font-weight: 800;
      }
      .banner__msg span {
        color: var(--muted);
      }
      .banner__flow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(
            0,
            1fr
          );
        align-items: center;
        gap: 10px;
        padding: 0;
        list-style: none;
      }
      .banner__flow li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(
          color-mix(in srgb, var(--paper) 62%, var(--surface)),
          var(--surface)
        );
      }
      .banner__flow b {
        padding: 3px 7px;
        border-radius: 7px;
        background: var(--rust);
        color: #fff;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 800;
      }
      .banner__flow span {
        font-size: 13.5px;
        font-weight: 700;
      }
      .banner__flow i {
        color: var(--rust);
        font-size: 17px;
        font-style: normal;
        font-weight: 700;
      }
      .banner__foot {
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <p class="variant">VARIANT <b>03</b> —— 警示横幅 / ALERT BANNER</p>
      <section class="banner" aria-labelledby="t3-title">
        <header class="banner__head">
          <div class="banner__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#e4ae3e"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6.5 18a4.5 4.5 0 1 1 .42-8.98 6 6 0 0 1 11.16.6A4 4 0 0 1 17.5 17.5"
              />
              <path d="M12 11v7" />
              <path d="m8.5 15.5 3.5 3.5 3.5-3.5" />
            </svg>
          </div>
          <div class="banner__titles">
            <span class="banner__chip">手机转存提醒</span>
            <h2 id="t3-title">请先转存<em>，</em>再观看</h2>
          </div>
          <div class="banner__limit">
            <small>UNVERIFIED PLAY</small>
            <b>2:00</b>
            <span>未转存试看上限</span>
          </div>
        </header>
        <div class="banner__body">
          <p class="banner__msg">
            <strong>未转存直接播放通常只能试看 2 分钟</strong>
            <span>请使用手机打开链接，通过对应网盘 App 保存到自己的网盘。</span>
          </p>
          <ol class="banner__flow" aria-label="手机转存步骤">
            <li><b>01</b><span>手机打开</span></li>
            <i aria-hidden="true">›</i>
            <li><b>02</b><span>保存到网盘</span></li>
            <i aria-hidden="true">›</i>
            <li><b>03</b><span>网盘内观看</span></li>
          </ol>
          <footer class="banner__foot">
            资料状态、完整性及授权情况，请以各条资料说明为准。
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
