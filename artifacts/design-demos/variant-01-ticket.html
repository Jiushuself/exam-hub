<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资料卡变体 01 · 借阅凭据</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f3f7f4;
        --surface: #ffffff;
        --ink: #14251f;
        --muted: #5d6c66;
        --line: #dbe4df;
        --line-strong: #bfcfc7;
        --rust: #b45f49;
        --amber: #e4ae3e;
        --serif: 'Noto Serif SC', 'Songti SC', SimSun, serif;
        --sans: 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
        --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 68px 48px;
        background:
          radial-gradient(
            1100px 480px at 50% -12%,
            color-mix(in srgb, var(--amber) 7%, transparent),
            transparent
          ),
          var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }
      .stage {
        width: min(980px, 100%);
      }
      .variant {
        margin-bottom: 20px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
      }
      .variant b {
        color: var(--rust);
      }

      /* ── 借阅凭据 ── */
      .ticket {
        position: relative;
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr);
        border: 1.5px solid var(--ink);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 28px 60px -34px rgba(20, 50, 40, 0.35);
      }
      .ticket__frame {
        position: absolute;
        inset: 8px;
        border: 1px dashed
          color-mix(in srgb, var(--rust) 42%, var(--line-strong));
        border-radius: 8px;
        pointer-events: none;
      }
      .ticket__notch {
        position: absolute;
        z-index: 2;
        left: 148px;
        width: 24px;
        height: 24px;
        transform: translateX(-50%);
        border: 1.5px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
      }
      .ticket__notch--top {
        top: -13px;
      }
      .ticket__notch--bottom {
        bottom: -13px;
      }
      .ticket__stub {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 32px 0 26px;
        border-right: 2px dashed
          color-mix(in srgb, var(--rust) 48%, var(--line-strong));
      }
      .ticket__brand {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.42em;
        writing-mode: vertical-rl;
      }
      .ticket__seal {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        transform: rotate(-6deg);
        border-radius: 8px;
        background: var(--rust);
        box-shadow:
          0 0 0 3px var(--surface),
          0 0 0 4.5px color-mix(in srgb, var(--rust) 55%, transparent);
        color: #fdf3ea;
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 900;
        line-height: 1.2;
      }
      .ticket__no {
        color: color-mix(in srgb, var(--rust) 78%, var(--surface));
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.28em;
        writing-mode: vertical-rl;
      }
      .ticket__body {
        display: grid;
        align-content: center;
        gap: 14px;
        padding: 34px 42px 28px;
      }
      .ticket__chip {
        width: fit-content;
        padding: 5px 12px;
        border: 1px solid color-mix(in srgb, var(--rust) 32%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--amber) 12%, var(--surface));
        color: var(--rust);
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .ticket__body h2 {
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 1.25;
      }
      .ticket__msg {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 2px 10px;
        font-size: 13.5px;
        line-height: 1.7;
      }
      .ticket__msg strong {
        color: var(--rust);
        font-weight: 800;
      }
      .ticket__msg span {
        color: var(--muted);
      }
      .ticket__route {
        position: relative;
        display: flex;
        gap: 64px;
        margin-top: 8px;
        padding: 12px 0 2px;
        list-style: none;
      }
      .ticket__route::before {
        position: absolute;
        top: 27px;
        right: 15px;
        left: 15px;
        border-top: 2px solid
          color-mix(in srgb, var(--amber) 60%, var(--line-strong));
        content: '';
      }
      .ticket__route li {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 9px;
      }
      .ticket__route b {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 2px solid var(--rust);
        border-radius: 9px;
        background: var(--surface);
        color: var(--rust);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 800;
      }
      .ticket__route span {
        font-size: 13.5px;
        font-weight: 700;
      }
      .ticket__foot {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px dashed
          color-mix(in srgb, var(--rust) 38%, var(--line-strong));
      }
      .ticket__foot small {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.6;
      }
      .ticket__foot em {
        align-self: center;
        color: color-mix(in srgb, var(--rust) 80%, var(--surface));
        font-family: var(--mono);
        font-size: 10px;
        font-style: normal;
        font-weight: 700;
        letter-spacing: 0.2em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <p class="variant">VARIANT <b>01</b> —— 借阅凭据 / BOOKPLATE TICKET</p>
      <section class="ticket" aria-labelledby="t1-title">
        <i class="ticket__frame" aria-hidden="true"></i>
        <i class="ticket__notch ticket__notch--top" aria-hidden="true"></i>
        <i class="ticket__notch ticket__notch--bottom" aria-hidden="true"></i>
        <div class="ticket__stub">
          <span class="ticket__brand">EXAM-HUB · 资料室</span>
          <span class="ticket__seal">转<br />存</span>
          <span class="ticket__no">NO. 2026-0927</span>
        </div>
        <div class="ticket__body">
          <span class="ticket__chip">手机转存提醒</span>
          <h2 id="t1-title">请先转存，再观看</h2>
          <p class="ticket__msg">
            <strong>未转存直接播放通常只能试看 2 分钟</strong>
            <span>请使用手机打开链接，通过对应网盘 App 保存到自己的网盘。</span>
          </p>
          <ol class="ticket__route" aria-label="手机转存步骤">
            <li><b>01</b><span>手机打开</span></li>
            <li><b>02</b><span>保存到网盘</span></li>
            <li><b>03</b><span>网盘内观看</span></li>
          </ol>
          <footer class="ticket__foot">
            <small>资料状态、完整性及授权情况，请以各条资料说明为准。</small>
            <em>MOBILE ONLY</em>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
